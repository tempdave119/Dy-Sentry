name: Build Desktop (Tauri)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "覆盖版本号（默认取 tag 去掉 v 前缀）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Dy-Sentry Desktop (Windows NSIS)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg (windows-x64)
        run: |
          mkdir -p bin
          curl -L -o bin/ffmpeg.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" \
            --retry 5 --retry-delay 5 --max-time 300
          # 解压出 ffmpeg.exe 到 bin/（spec 从 <root>/bin/ffmpeg.exe 收集）
          7z x -y bin/ffmpeg.zip -obin/ffmpeg_tmp >/dev/null
          cp bin/ffmpeg_tmp/ffmpeg-*/bin/ffmpeg.exe bin/ffmpeg.exe
          rm -rf bin/ffmpeg.zip bin/ffmpeg_tmp
          ./bin/ffmpeg.exe -version | head -1

      - name: PyInstaller build (Python sidecar)
        working-directory: deploy/windows
        run: pyinstaller dy-sentry.spec --clean --noconfirm

      - name: Stage sidecar binary (target triple)
        run: |
          # 单文件模式：PyInstaller 产出 dist/dy-sentry.exe（而非 dist/dy-sentry/ 文件夹）
          SRC="deploy/windows/dist/dy-sentry.exe"
          DST="desktop/binaries/dy-sentry-x86_64-pc-windows-msvc.exe"
          if [ ! -f "$SRC" ]; then echo "::error::sidecar not found at $SRC"; exit 1; fi
          mkdir -p desktop/binaries
          cp "$SRC" "$DST"
          echo "staged sidecar: $(ls -la $DST | awk '{print $5}') bytes"

      - name: Compute version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"

      - name: Inject version into Tauri config
        run: |
          V="${{ steps.ver.outputs.version }}"
          # tauri.conf.json
          sed -i "s/\"version\": \"0.1.0\"/\"version\": \"$V\"/" desktop/src-tauri/tauri.conf.json
          # Cargo.toml
          sed -i "s/^version = \"0.1.0\"/version = \"$V\"/" desktop/src-tauri/Cargo.toml
          grep '"version"' desktop/src-tauri/tauri.conf.json | head -1
          grep '^version' desktop/src-tauri/Cargo.toml | head -1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install NSIS (bundler)
        run: |
          choco install nsis -y
          # choco 不一定把 NSIS 写入后续步骤的 PATH，显式追加以确保 makensis 可被 cargo tauri build 找到
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Tauri build (NSIS installer)
        working-directory: desktop/src-tauri
        run: cargo tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Dy-Sentry-${{ steps.ver.outputs.version }}-Desktop-Setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90
