name: Build Windows Installer

# 行业主流做法：在云端 Windows runner 上「原生构建」（PyInstaller + Inno Setup）。
# 触发：推送 v* tag，或手动 workflow_dispatch。产物为 artifact，不自动挂 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg (Windows, essentials)
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -MaximumRetryCount 3 -RetryIntervalSec 5
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item $exe.FullName bin/ffmpeg.exe
          "Downloaded ffmpeg -> bin/ffmpeg.exe"

      - name: PyInstaller build
        working-directory: deploy/windows
        run: pyinstaller dy-sentry.spec --clean --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compute version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v') { $tag = $tag.Substring(1) }
          if ([string]::IsNullOrEmpty($tag)) { $tag = "0.0.0" }
          echo "version=$tag" >> $env:GITHUB_OUTPUT
          "Version: $tag"

      - name: Build installer (version injected)
        working-directory: deploy/windows
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup 6" -Filter ISCC.exe -Recurse | Select-Object -First 1).FullName
          if (-not $iscc) { $iscc = (Get-ChildItem "C:\Program Files\Inno Setup 6" -Filter ISCC.exe -Recurse | Select-Object -First 1).FullName }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Dy-Sentry-${{ steps.ver.outputs.version }}-Setup
          path: deploy/windows/installer_output/*.exe
          if-no-files-found: error
          retention-days: 90
