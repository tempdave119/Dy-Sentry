name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg (Windows)
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item $exe.FullName bin/ffmpeg.exe
          "Downloaded ffmpeg -> bin/ffmpeg.exe"

      - name: PyInstaller build
        run: pyinstaller dy-sentry.spec --clean --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup 6" -Filter ISCC.exe -Recurse | Select-Object -First 1).FullName
          if (-not $iscc) { $iscc = (Get-ChildItem "C:\Program Files\Inno Setup 6" -Filter ISCC.exe -Recurse | Select-Object -First 1).FullName }
          & $iscc installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dy-Sentry-Windows-Setup
          path: installer_output/*.exe
