[package]
name = "dy-sentry-desktop"
version = "0.1.0"
description = "Dy-Sentry desktop client (Tauri)"
authors = ["tempdave119"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dy_sentry_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "rt-multi-thread"] }
log = "0.4"

[features]
# Managed by the Tauri CLI.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Opt-in: enables webview devtools. Avoid shipping in release builds.
devtools = ["tauri/devtools"]
