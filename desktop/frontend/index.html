<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dy-Sentry</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #14141a; color: #eee;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .box { text-align: center; user-select: none; }
    .logo {
      width: 84px; height: 84px; margin: 0 auto 18px;
      border-radius: 20px; background: #14141a;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 2px #2a2a33, 0 10px 30px rgba(0,0,0,.4);
    }
    .logo .dot { width: 26px; height: 26px; border-radius: 50%; background: #e74c3c; }
    .title { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
    .sub { margin-top: 6px; font-size: 13px; color: #9aa; }
    .spinner {
      margin: 22px auto 0; width: 26px; height: 26px;
      border: 3px solid #2a2a33; border-top-color: #7fb3ff;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo"><span class="dot"></span></div>
    <div class="title">Dy-Sentry</div>
    <div class="sub">正在启动监控与录制服务…</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
